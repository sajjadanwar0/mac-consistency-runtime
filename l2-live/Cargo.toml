[package]
name = "l2-live"
version = "0.2.0"
edition = "2024"
description = "Live L2 deployment: real model agents on the verified runtime (src/l2_exec.rs) with output commit releasing the executor's effect, next to the unguarded baseline"

[dependencies]
agent-consistency-runtime = { path = ".." }
ureq = { version = "2.9", features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[[bin]]
name = "l2_live"
path = "src/main.rs"
